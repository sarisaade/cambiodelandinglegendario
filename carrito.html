<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Carrito</title>

    <link rel="stylesheet" href="./styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- ICONOS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Montserrat',sans-serif;
  overflow-x:hidden;
}

a{
  text-decoration:none;
  color:inherit;
}
/* =========================
   TOPBAR
========================= */

.topbar{

  position:fixed;

  top:0;
  left:0;

  width:100%;

  height:38px;

  z-index:10000;

  background:#061426;

  color:#fff;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:40px;

  flex-wrap:wrap;

  font-size:13px;

  letter-spacing:1px;
}

.navbar{

  position:fixed;

  top:34px;

  left:0;

  width:100%;

  margin-top:-1px;

  z-index:9999;

  background:rgba(255,255,255,.94);

  backdrop-filter:blur(10px);

  padding:22px 40px;

  display:grid;

  grid-template-columns:1fr auto 1fr;

  align-items:center;

  transition:.3s ease;

  box-shadow:0 4px 20px rgba(0,0,0,.05);
}


.logo{
  justify-self:center;

  font-family:'Cormorant Garamond',serif;

  font-size:54px;

  font-weight:600;

  letter-spacing:2px;
}

.nav-links{
  display:flex;
  gap:28px;
  font-size:14px;
  text-transform:uppercase;
}

.icons{
  display:flex;
  gap:20px;
  font-size:20px;
  justify-self:end;
}
@media(max-width:768px){

  body{
    padding-top:140px;
  }

  .topbar{
    gap:8px;
    font-size:10px;
    padding:8px 10px;
    text-align:center;
  }

  .navbar{

    top:32px;

    grid-template-columns:1fr;

    gap:12px;

    padding:14px 18px;

    text-align:center;
  }

  .nav-links{
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    font-size:11px;
  }

  .logo{
    font-size:32px;
    line-height:1;
  }

  .icons{
    justify-self:center;
  }

  </style>

    
</head>

<body>
    

<!-- HEADER -->
<header>
    <div class="hero">
        <div class="hero-header">

            <div class="topbar">
    <span>ENVIOS A TODO EL PAIS</span>
    <span>CONSULTA POR EL TUYO</span>
    
  </div>

  <nav class="navbar">

    <div class="nav-links">
      <a href="./index.html">Inicio</a>
      <a href="./productos.html">Mira nuestros productos</a>
      
      
    </div>

    <div class="logo">
      LEGENDARIO
    </div>

   <div class="icons">

  

            <a href="./carrito.html" class="cart">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count">0</span>
            </a>

        </div>
    </div>
</header>

<!-- CONTENIDO -->
<main>

    <div class="cart-container">

        <!-- PRODUCTOS -->
        <div class="cart-items">
          
        </div>

        <!-- TOTAL -->
        <h2>Total: <span class="cart-total">$0</span></h2>

        <!-- BOTONES -->
        <div class="acciones-carrito">

            <button class="clear-cart">
                <i class="fas fa-trash"></i> Vaciar carrito
            </button>

            <a href="./productos.html" class="seguir-comprando">
                Seguir comprando
            </a>

        </div>

        <!-- FORMULARIO -->
        <form id="confirmation-form">

            <input 
                type="text" 
                id="buyer-name" 
                placeholder="Nombre y apellido" 
                required
            >

            <button type="submit" class="btn-confirmar">
                Confirmar por WhatsApp
            </button>

        </form>

    </div>

</main>

<!-- SCRIPT -->
<script src="./script.js"></script>

</body>
</html>
